spring.application.name=task-management

# H2 file-based database (development) – AUTO_SERVER allows IntelliJ & app to share the connection
spring.datasource.url=jdbc:h2:file:./data/taskmanagement;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console – enabled only in local/dev (disable in prod)
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

